<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketing Department 2027</title>
  <style>
    :root {
      --ink: #1a2e2a;
      --ink-muted: #3d524c;
      --surface-alt: #eef3f1;
      --accent: #264540;
      --wire: #b8c9c3;
      --wire-label: #6b7f78;
      --white: #ffffff;
      --max: 36rem;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--white);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      line-height: 1.55;
    }
    .banner {
      background: var(--surface-alt);
      border-bottom: 1px dashed var(--wire);
      color: var(--wire-label);
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      padding: 0.5rem 1.25rem;
      text-align: center;
      text-transform: uppercase;
    }
    .wrap { margin: 0 auto; max-width: var(--max); padding: 2.5rem 1.25rem 4rem; }
    h1 {
      font-size: clamp(1.5rem, 3vw, 1.85rem);
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin: 0 0 0.5rem;
    }
    p { color: var(--ink-muted); font-size: 0.975rem; }
    ul { margin: 1.25rem 0 0; padding-left: 1.2rem; }
    li { margin: 0.65rem 0; }
    a { color: var(--accent); font-weight: 650; }
  </style>
</head>
<body>
  <div class="banner">Marketing Department 2027</div>
  <main class="wrap">
    <h1>Marketing Department 2027</h1>
    <p>How experts and bots share a piece of work, from the written standard through to what the audience sees.</p>
    <ul>
      <li><a href="full-process.html">Full Process</a></li>
      <li><a href="simple-publishing-process.html">Simple Publishing Process</a></li>
    </ul>
  </main>
</body>
</html>
